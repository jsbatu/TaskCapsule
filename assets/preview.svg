<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Acrylic Island Glass -->
    <linearGradient id="islandGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.96" />
    </linearGradient>

    <!-- Subtle Border Stroke -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowIsland" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.15" />
    </filter>

    <filter id="shadowPill" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 400; fill: #94a3b8; }
    .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #38bdf8; }
    .island-text { font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; fill: #ffffff; }
  </style>

  <!-- Canvas Background -->
  <rect width="1000" height="520" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Glow Ambient Lines -->
  <circle cx="200" cy="150" r="180" fill="#38bdf8" opacity="0.06" filter="blur(60px)" />
  <circle cx="800" cy="350" r="220" fill="#818cf8" opacity="0.07" filter="blur(70px)" />

  <!-- Header Text -->
  <text x="50" y="65" class="title" font-size="32" letter-spacing="-0.5">💊 TaskCapsule</text>
  <text x="50" y="95" class="subtitle" font-size="14">Fluent-Styled Media Capsule &amp; Synced Lyrics Hub Docked in Windows 11 Taskbar</text>

  <!-- Windows 11 Taskbar Mockup Strip -->
  <g transform="translate(50, 440)">
    <rect x="0" y="0" width="900" height="48" rx="8" fill="#111318" stroke="#1e222b" stroke-width="1" />
    
    <!-- Windows Start & Search Icons Mockup -->
    <g transform="translate(425, 14)">
      <!-- Windows logo -->
      <rect x="0" y="0" width="9" height="9" rx="1.5" fill="#38bdf8" />
      <rect x="11" y="0" width="9" height="9" rx="1.5" fill="#38bdf8" />
      <rect x="0" y="11" width="9" height="9" rx="1.5" fill="#38bdf8" />
      <rect x="11" y="11" width="9" height="9" rx="1.5" fill="#38bdf8" />
      
      <!-- Search -->
      <circle cx="38" cy="10" r="5" stroke="#94a3b8" stroke-width="2" fill="none" />
      <line x1="42" y1="14" x2="47" y2="19" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      
      <!-- Taskview -->
      <rect x="62" y="3" width="10" height="14" rx="2" stroke="#94a3b8" stroke-width="1.8" fill="none" />
      <rect x="70" y="6" width="9" height="11" rx="1.5" stroke="#64748b" stroke-width="1.5" fill="none" />
    </g>

    <!-- Tray Clocks -->
    <text x="830" y="24" class="subtitle" font-size="12" fill="#cbd5e1" font-weight="600">22:28</text>
    <text x="825" y="38" class="subtitle" font-size="10" fill="#64748b">10/23/2026</text>

    <!-- STATE A: Collapsed Capsule Resting on Taskbar Left -->
    <g transform="translate(12, 6)" filter="url(#shadowPill)">
      <rect x="0" y="0" width="240" height="36" rx="18" fill="url(#islandGlass)" stroke="url(#glassBorder)" stroke-width="1" />
      
      <!-- Vinyl Disc Icon -->
      <circle cx="20" cy="18" r="11" fill="#1e1e24" stroke="#475569" stroke-width="0.8" />
      <circle cx="20" cy="18" r="4" fill="#0f172a" />
      <circle cx="20" cy="18" r="1.5" fill="#38bdf8" />

      <!-- Synced Lyric Karaoke Text -->
      <text x="40" y="22" class="island-text" font-size="12" font-weight="600">No Surprises • Radiohead</text>

      <!-- Equalizer Visualizer Bars -->
      <g transform="translate(208, 11)">
        <rect x="0" y="2" width="3" height="12" rx="1.5" fill="#ffffff" />
        <rect x="5" y="6" width="3" height="8" rx="1.5" fill="#ffffff" />
        <rect x="10" y="1" width="3" height="13" rx="1.5" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- STATE B: Expanded Media Hub Display Card -->
  <g transform="translate(280, 140)" filter="url(#shadowIsland)">
    <!-- Main Card Body -->
    <rect x="0" y="0" width="440" height="160" rx="24" fill="url(#islandGlass)" stroke="url(#glassBorder)" stroke-width="1.2" />

    <!-- Album Art with drop shadow -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="120" height="120" rx="16" fill="#1e293b" />
      <!-- Album Art Cover Simulation -->
      <rect x="0" y="0" width="120" height="120" rx="16" fill="url(#accentCyan)" opacity="0.85" />
      <circle cx="60" cy="60" r="34" fill="#0f172a" opacity="0.9" />
      <polygon points="54,48 54,72 74,60" fill="#38bdf8" />
    </g>

    <!-- Track Details -->
    <g transform="translate(160, 26)">
      <!-- Status Badge -->
      <rect x="0" y="0" width="76" height="20" rx="10" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="0.8" />
      <circle cx="8" cy="10" r="3" fill="#38bdf8" />
      <text x="16" y="14" class="badge">NOW PLAYING</text>

      <!-- Title & Artist -->
      <text x="0" y="46" class="title" font-size="19" font-weight="700">No Surprises</text>
      <text x="0" y="66" class="subtitle" font-size="13" fill="#94a3b8">Radiohead — OK Computer</text>

      <!-- Progress Bar & Timers -->
      <g transform="translate(0, 88)">
        <text x="0" y="10" class="subtitle" font-size="11">01:16</text>
        
        <!-- Track Bar -->
        <rect x="36" y="4" width="180" height="4" rx="2" fill="#334155" />
        <rect x="36" y="4" width="70" height="4" rx="2" fill="url(#accentCyan)" />
        <circle cx="106" cy="6" r="5" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)" />

        <text x="224" y="10" class="subtitle" font-size="11">03:48</text>
      </g>

      <!-- Controls Hint -->
      <g transform="translate(0, 116)">
        <rect x="0" y="0" width="94" height="18" rx="5" fill="#1e222b" stroke="#334155" stroke-width="0.8" />
        <text x="8" y="13" class="subtitle" font-size="10" fill="#94a3b8">Space: Play/Pause</text>

        <rect x="104" y="0" width="86" height="18" rx="5" fill="#1e222b" stroke="#334155" stroke-width="0.8" />
        <text x="112" y="13" class="subtitle" font-size="10" fill="#94a3b8">5s Auto-Collapse</text>
      </g>
    </g>
  </g>

  <!-- Feature Callout Badges Top Right -->
  <g transform="translate(720, 48)">
    <rect x="0" y="0" width="230" height="32" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <text x="16" y="20" class="title" font-size="12" fill="#e2e8f0">Taskbar Native Architecture</text>
  </g>
  <g transform="translate(720, 88)">
    <rect x="0" y="0" width="230" height="32" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <text x="16" y="20" class="title" font-size="12" fill="#38bdf8">Live Synced Karaoke Lyrics</text>
  </g>
</svg>
